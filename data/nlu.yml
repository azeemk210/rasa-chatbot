version: "3.1"

nlu:

- intent: greet
  examples: |
    - Hi
    - Hello
    - Hey
    - Good morning
    - Good evening
    - Good afternoon
    
- intent: ask_region_members
  examples: |
    - Are there any members in [Italy](region)?
    - Is anyone from [Germany](region) part of the community?
    - Do we have members in [Austria](region)?

- intent: ask_member_names
  examples: |
    - Who are the members in [Italy](region)?
    - List the members from [Germany](region).
    - Give me names of members in [Austria](region).

- intent: ask_member_details
  examples: |
    - Provide details for [John Doe](name)
    - Can you provide details for [Chris Evans](name)?
    - Show me the contact of [Emily Johnson](name)
    - Give details about [Michael Brown](name)
    - I need information about [Sarah Wilson](name)
    - What is the phone number of [Laura Martinez](name)?
    - How can I contact [Noah Lewis](name)?
    - Tell me about [Isabella Young](name)
    - Get me the email of [Liam Anderson](name)
    - Contact details of [Sophia Thomas](name)

